<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#495057"/>
    </marker>
  </defs>
  <text x="450" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">ACL 柜台资源地图（第4章）</text>
  <text x="450" y="48" text-anchor="middle" font-size="11" fill="#6b7280">自上而下：一次会话的生命周期；出错时查右侧错误码栏</text>

  <!-- 应用进程 -->
  <rect x="330" y="62" width="240" height="36" rx="8" fill="#e8f4ec" stroke="#2f9e63" stroke-width="1.5"/>
  <text x="450" y="85" text-anchor="middle" font-size="13" fill="#1f2937">你的应用进程（AI 框架 / C++ 程序）</text>

  <!-- 会话 -->
  <rect x="300" y="118" width="300" height="34" rx="8" fill="#f4f5f6" stroke="#adb5bd" stroke-width="1.2"/>
  <text x="450" y="140" text-anchor="middle" font-size="12.5" fill="#1f2937">会话：aclInit 点亮 · aclFinalize 关灯</text>
  <line x1="450" y1="98" x2="450" y2="118" stroke="#495057" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 四件套 -->
  <line x1="450" y1="152" x2="450" y2="172" stroke="#495057" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="70" y="192" font-size="12.5" font-weight="bold" fill="#2f9e63">四件套句柄（4.2）</text>
  <g font-size="12" fill="#1f2937">
    <rect x="70"  y="200" width="180" height="52" rx="8" fill="#e8f4ec" stroke="#2f9e63" stroke-width="1.5"/>
    <text x="160" y="222" text-anchor="middle" font-weight="bold">设备 Device</text>
    <text x="160" y="240" text-anchor="middle" font-size="11" fill="#495057">aclrtSetDevice(0) 选卡</text>
    <rect x="270" y="200" width="180" height="52" rx="8" fill="#e8f4ec" stroke="#2f9e63" stroke-width="1.5"/>
    <text x="360" y="222" text-anchor="middle" font-weight="bold">上下文 Context</text>
    <text x="360" y="240" text-anchor="middle" font-size="11" fill="#495057">资源作用域</text>
    <rect x="470" y="200" width="180" height="52" rx="8" fill="#e8f4ec" stroke="#2f9e63" stroke-width="1.5"/>
    <text x="560" y="222" text-anchor="middle" font-weight="bold">流 Stream</text>
    <text x="560" y="240" text-anchor="middle" font-size="11" fill="#495057">任务队列 / 传送带</text>
    <rect x="670" y="200" width="180" height="52" rx="8" fill="#e8f4ec" stroke="#2f9e63" stroke-width="1.5"/>
    <text x="760" y="222" text-anchor="middle" font-weight="bold">事件 Event</text>
    <text x="760" y="240" text-anchor="middle" font-size="11" fill="#495057">精细对齐用</text>
  </g>
  <line x1="450" y1="252" x2="450" y2="278" stroke="#495057" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 内存 -->
  <text x="70" y="296" font-size="12.5" font-weight="bold" fill="#2f9e63">内存（4.3）</text>
  <rect x="70" y="304" width="380" height="56" rx="8" fill="#fff7e6" stroke="#e8930c" stroke-width="1.5"/>
  <text x="260" y="326" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">借内存：aclrtMalloc 三兄弟</text>
  <text x="260" y="346" text-anchor="middle" font-size="11" fill="#495057">HUGE_FIRST / HUGE_ONLY / NORMAL_ONLY（第8章策略）</text>
  <rect x="470" y="304" width="380" height="56" rx="8" fill="#fff7e6" stroke="#e8930c" stroke-width="1.5"/>
  <text x="660" y="326" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">搬运：aclrtMemcpy</text>
  <text x="660" y="346" text-anchor="middle" font-size="11" fill="#495057">H2D 搬入 · D2H 搬回（同步语义，读前先同步）</text>
  <line x1="450" y1="360" x2="450" y2="386" stroke="#495057" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 三种 Launch -->
  <text x="70" y="404" font-size="12.5" font-weight="bold" fill="#2f9e63">下单 Launch（4.4）</text>
  <g font-size="12" fill="#1f2937">
    <rect x="70"  y="412" width="255" height="60" rx="8" fill="#e7f0fa" stroke="#1971c2" stroke-width="1.5"/>
    <text x="197" y="434" text-anchor="middle" font-weight="bold">① aclnn 两段式（点菜）</text>
    <text x="197" y="452" text-anchor="middle" font-size="11" fill="#495057">GetWorkspaceSize → aclnnXxx</text>
    <text x="197" y="466" text-anchor="middle" font-size="11" fill="#2f9e63">现行主力 · 推荐</text>
    <rect x="345" y="412" width="255" height="60" rx="8" fill="#e7f0fa" stroke="#1971c2" stroke-width="1.5"/>
    <text x="472" y="434" text-anchor="middle" font-weight="bold">② aclrtLaunchKernel（下厨）</text>
    <text x="472" y="452" text-anchor="middle" font-size="11" fill="#495057">&lt;&lt;&lt;&gt;&gt;&gt; 的语法糖本体（V3）</text>
    <text x="472" y="466" text-anchor="middle" font-size="11" fill="#2f9e63">自研算子 · 现行主力</text>
    <rect x="620" y="412" width="230" height="60" rx="8" fill="#f4f5f6" stroke="#adb5bd" stroke-width="1.2" stroke-dasharray="5 3"/>
    <text x="735" y="434" text-anchor="middle" font-weight="bold">③ rtKernelLaunch（老菜单）</text>
    <text x="735" y="452" text-anchor="middle" font-size="11" fill="#495057">老工具链工程追溯</text>
    <text x="735" y="466" text-anchor="middle" font-size="11" fill="#e8590c">新代码不推荐</text>
  </g>
  <line x1="450" y1="472" x2="450" y2="498" stroke="#495057" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 同步 -->
  <text x="70" y="516" font-size="12.5" font-weight="bold" fill="#2f9e63">验收（4.5）</text>
  <rect x="70" y="524" width="780" height="48" rx="8" fill="#f3e8fd" stroke="#9c36b5" stroke-width="1.5"/>
  <text x="460" y="544" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">同步原语：aclrtSynchronizeStream（等全流）· aclrtSynchronizeDevice（等全场，重）· RecordEvent / WaitEvent（等点位）</text>
  <text x="460" y="562" text-anchor="middle" font-size="11" fill="#495057">默认异步：下单即走、事后回执；读结果前必须自己画同步</text>

  <!-- 右侧错误码栏 -->
  <rect x="866" y="62" width="20" height="510" rx="6" fill="#fceff1" stroke="#c92a2a" stroke-width="1" transform="translate(-6,0)"/>
  <text x="876" y="320" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#c92a2a" transform="rotate(90 876 320)">出错找谁（4.6）：107xxx runtime 域 · 145xxx GE 域 · error_manager 译码 → 详见第7章</text>
</svg>
