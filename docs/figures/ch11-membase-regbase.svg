<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs>
  <text x="320" y="26" text-anchor="middle" font-size="17" font-weight="bold" fill="#111827">MemBase vs RegBase：中间结果落在哪</text>
  <text x="320" y="47" text-anchor="middle" font-size="12.5" fill="#6b7280">理想教学读写计法——非实测，不含寄存器溢出等额外访问</text>
  <rect x="16" y="66" width="296" height="360" rx="12" fill="#f8f9fa" stroke="#4263eb" stroke-width="2"/>
  <text x="164" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#4263eb">MemBase（A2/A3）</text>
  <text x="164" y="110" text-anchor="middle" font-size="12" fill="#495057">LocalTensor 进出，每步落 UB</text>
  <rect x="40" y="124" width="86" height="150" rx="8" fill="#fff7e6" stroke="#e8590c" stroke-width="1.5"/><text x="83" y="203" text-anchor="middle" font-size="14" font-weight="bold">UB</text>
  <rect x="196" y="124" width="86" height="150" rx="8" fill="#e7f0fa" stroke="#1971c2" stroke-width="1.5"/><text x="239" y="192" text-anchor="middle" font-size="14" font-weight="bold">Vector</text><text x="239" y="210" text-anchor="middle" font-size="11" >计算单元</text>
  <path d="M126 140 L196 140" stroke="#495057" stroke-width="1.6" fill="none" marker-end="url(#arr)"/><text x="161" y="136" text-anchor="middle" font-size="11.5" fill="#1971c2">读</text>
  <path d="M196 164 L126 164" stroke="#495057" stroke-width="1.6" fill="none" marker-end="url(#arr)"/><text x="161" y="160" text-anchor="middle" font-size="11.5" fill="#c92a2a">写</text>
  <path d="M126 188 L196 188" stroke="#495057" stroke-width="1.6" fill="none" marker-end="url(#arr)"/><text x="161" y="184" text-anchor="middle" font-size="11.5" fill="#1971c2">读</text>
  <path d="M196 212 L126 212" stroke="#495057" stroke-width="1.6" fill="none" marker-end="url(#arr)"/><text x="161" y="208" text-anchor="middle" font-size="11.5" fill="#c92a2a">写</text>
  <path d="M126 236 L196 236" stroke="#495057" stroke-width="1.6" fill="none" marker-end="url(#arr)"/><text x="161" y="232" text-anchor="middle" font-size="11.5" fill="#1971c2">读</text>
  <path d="M196 260 L126 260" stroke="#495057" stroke-width="1.6" fill="none" marker-end="url(#arr)"/><text x="161" y="256" text-anchor="middle" font-size="11.5" fill="#c92a2a">写</text>
  <text x="40" y="300" font-size="13" fill="#495057">教学计法：每步一读一写（op1→2→3）</text>
  <text x="40" y="322" font-size="13" fill="#495057">中间结果在 UB 只是「路过」</text>
  <text x="40" y="350" font-size="13" font-weight="bold" fill="#1f2937">API：LocalTensor 逐步进出</text>
  <text x="40" y="374" font-size="13" fill="#2f9e63">优点：封装完整、不易错</text>
  <text x="40" y="398" font-size="13" fill="#c92a2a">代价：中间结果反复读写 UB</text>
  <rect x="328" y="66" width="296" height="360" rx="12" fill="#f6fbf7" stroke="#2f9e63" stroke-width="2"/>
  <text x="476" y="92" text-anchor="middle" font-size="15" font-weight="bold" fill="#2f9e63">RegBase（950）</text>
  <text x="476" y="110" text-anchor="middle" font-size="12" fill="#495057">Reg 矢量计算 API：寄存器驻留</text>
  <rect x="352" y="124" width="86" height="36" rx="8" fill="#fff7e6" stroke="#e8590c" stroke-width="1.5"/><text x="395" y="147" text-anchor="middle" font-size="14" font-weight="bold">UB</text>
  <rect x="352" y="216" width="86" height="40" rx="8" fill="#f3e8fd" stroke="#9c36b5" stroke-width="1.5"/><text x="395" y="232" text-anchor="middle" font-size="13.5" font-weight="bold">VF Reg</text><text x="395" y="249" text-anchor="middle" font-size="10.5">vector/mask</text>
  <rect x="500" y="180" width="86" height="52" rx="8" fill="#e7f0fa" stroke="#1971c2" stroke-width="1.5"/><text x="543" y="201" text-anchor="middle" font-size="13.5" font-weight="bold">Vector</text><text x="543" y="220" text-anchor="middle" font-size="11">op 链式</text>
  <path d="M395 160 L395 216" stroke="#2f9e63" stroke-width="2" fill="none" marker-end="url(#arr)"/><text x="388" y="192" text-anchor="end" font-size="11.5" fill="#2f9e63">①load</text>
  <path d="M438 230 L500 214" stroke="#495057" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  <path d="M500 200 L442 226" stroke="#495057" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
  <text x="498" y="172" text-anchor="end" font-size="11.5" fill="#6b7280">②③寄存器链</text>
  <path d="M409 216 L409 164" stroke="#c92a2a" stroke-width="1.7" stroke-dasharray="6 4" fill="none" marker-end="url(#arr)"/><text x="416" y="186" font-size="11.5" fill="#c92a2a">④store</text>
  <text x="352" y="286" font-size="13" fill="#495057">教学计法：首尾各 1 次访问</text>
  <text x="352" y="308" font-size="13" fill="#495057">中间结果驻留寄存器文件</text>
  <text x="352" y="336" font-size="13" font-weight="bold" fill="#1f2937">API：load→多 op→store</text>
  <text x="352" y="360" font-size="13" fill="#2f9e63">方向：少 UB 读写（须实测）</text>
  <text x="352" y="384" font-size="12" fill="#495057">路径经 UB：本节 SIMD Reg 接口</text>
  <text x="352" y="402" font-size="12" fill="#495057">（SIMT 另有 GM 直读）</text>
  <rect x="16" y="446" width="608" height="64" rx="10" fill="#fff7e6" stroke="#e8590c" stroke-width="1.2"/>
  <text x="320" y="470" text-anchor="middle" font-size="13" font-weight="bold">是否采用 Reg 链：结合目标产品、寄存器压力与实测决定</text>
  <text x="320" y="494" text-anchor="middle" font-size="12" fill="#495057">两侧均为单输入逐元素三步的教学计法（op1/op2/op3），非实测、不含溢出等额外访问</text>
</svg>