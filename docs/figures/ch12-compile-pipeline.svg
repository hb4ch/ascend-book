<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#495057"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1971c2"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f9e63"/>
    </marker>
  </defs>
  <text x="460" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">从 .asc 到可执行：bisheng 异构编译流水线（AI Core SIMD）</text>
  <text x="460" y="46" text-anchor="middle" font-size="11" fill="#6b7280">三路分工对应硬件分工（Host 管账 · Cube 算矩阵 · Vector 算向量）；--npu-arch 在分路口选定目标架构</text>

  <!-- 源码列 -->
  <rect x="40" y="120" width="150" height="240" rx="10" fill="#f4f5f6" stroke="#adb5bd" stroke-width="1.5"/>
  <text x="115" y="146" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f2937">源码</text>
  <rect x="58" y="160" width="114" height="40" rx="6" fill="#fff" stroke="#4263eb" stroke-width="1.4"/>
  <text x="115" y="184" text-anchor="middle" font-size="11" fill="#1f2937">main.cpp（Host）</text>
  <rect x="58" y="212" width="114" height="40" rx="6" fill="#fff" stroke="#e8590c" stroke-width="1.4"/>
  <text x="115" y="232" text-anchor="middle" font-size="11" fill="#1f2937">add_kernel.asc</text>
  <text x="115" y="246" text-anchor="middle" font-size="9.5" fill="#6b7280">（Host/Device 混合）</text>
  <text x="115" y="290" text-anchor="middle" font-size="10.5" fill="#6b7280">.asc 与头文件可承载</text>
  <text x="115" y="308" text-anchor="middle" font-size="10.5" fill="#6b7280">Device / Host / 混合代码</text>
  <text x="115" y="336" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#c92a2a">.c/.cpp = Host-only</text>

  <!-- bisheng 分路编译 -->
  <rect x="250" y="150" width="140" height="180" rx="10" fill="#eef2fb" stroke="#4263eb" stroke-width="2"/>
  <text x="320" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#4263eb">bisheng</text>
  <text x="320" y="200" text-anchor="middle" font-size="10.5" fill="#495057">--npu-arch=dav-xxxx</text>
  <text x="320" y="220" text-anchor="middle" font-size="10.5" fill="#495057">-O3 / -g / -dc …</text>
  <text x="320" y="250" text-anchor="middle" font-size="11" font-weight="bold" fill="#1971c2">三路分编译</text>
  <text x="320" y="270" text-anchor="middle" font-size="10" fill="#6b7280">（SIMT 加 --enable-simt，</text>
  <text x="320" y="286" text-anchor="middle" font-size="10" fill="#6b7280">仅一路、不分 Cube/Vector）</text>

  <!-- 三路二进制 -->
  <g font-size="11" fill="#1f2937">
    <rect x="450" y="120" width="130" height="42" rx="6" fill="#eef2fb" stroke="#4263eb" stroke-width="1.4"/>
    <text x="515" y="145" text-anchor="middle">Host 二进制</text>
    <rect x="450" y="222" width="130" height="42" rx="6" fill="#fdf0e5" stroke="#e8590c" stroke-width="1.4"/>
    <text x="515" y="247" text-anchor="middle">Cube 二进制</text>
    <rect x="450" y="300" width="130" height="42" rx="6" fill="#e8f4ec" stroke="#2f9e63" stroke-width="1.4"/>
    <text x="515" y="325" text-anchor="middle">Vector 二进制</text>
  </g>

  <!-- 箭头 源->bisheng -->
  <path d="M190 180 L250 200" stroke="#4263eb" stroke-width="1.8" fill="none" marker-end="url(#arrb)"/>
  <path d="M190 232 L250 260" stroke="#e8590c" stroke-width="1.8" fill="none" marker-end="url(#arro)"/>
  <!-- bisheng -> 三路 -->
  <path d="M390 190 L450 141" stroke="#4263eb" stroke-width="1.8" fill="none" marker-end="url(#arrb)"/>
  <path d="M390 240 L450 243" stroke="#e8590c" stroke-width="1.8" fill="none" marker-end="url(#arro)"/>
  <path d="M390 280 L450 321" stroke="#2f9e63" stroke-width="1.8" fill="none" marker-end="url(#arrg)"/>

  <!-- Fatbin -->
  <rect x="640" y="236" width="120" height="90" rx="10" fill="#fff7e6" stroke="#e8590c" stroke-width="1.6"/>
  <text x="700" y="274" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f2937">Fatbin</text>
  <text x="700" y="294" text-anchor="middle" font-size="10.5" fill="#495057">Cube + Vector</text>
  <text x="700" y="310" text-anchor="middle" font-size="10.5" fill="#495057">先链接</text>
  <path d="M580 243 L640 262" stroke="#e8590c" stroke-width="1.8" fill="none" marker-end="url(#arro)"/>
  <path d="M580 321 L640 300" stroke="#2f9e63" stroke-width="1.8" fill="none" marker-end="url(#arrg)"/>

  <!-- 可执行 -->
  <rect x="640" y="120" width="120" height="70" rx="10" fill="#e8f4ec" stroke="#2f9e63" stroke-width="1.8"/>
  <text x="700" y="150" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f2937">可执行 / .so / .a</text>
  <text x="700" y="170" text-anchor="middle" font-size="10.5" fill="#495057">Fatbin 并入 Host 二进制</text>
  <path d="M580 141 L640 148" stroke="#4263eb" stroke-width="1.8" fill="none" marker-end="url(#arrb)"/>
  <path d="M700 236 L700 190" stroke="#495057" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>

  <!-- 运行时衔接 -->
  <rect x="790" y="120" width="110" height="70" rx="10" fill="#f8f0fc" stroke="#9c36b5" stroke-width="1.6"/>
  <text x="845" y="146" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#862e9c">第5章</text>
  <text x="845" y="166" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#862e9c">binary_loader</text>
  <text x="845" y="184" text-anchor="middle" font-size="9.5" fill="#862e9c">加载 → 启动</text>
  <path d="M760 155 L790 155" stroke="#9c36b5" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  <text x="775" y="142" text-anchor="middle" font-size="9.5" fill="#862e9c">Device ELF</text>

  <!-- RTC 分支注记 -->
  <rect x="250" y="370" width="510" height="56" rx="10" fill="#f8f0fc" stroke="#9c36b5" stroke-width="1.4" stroke-dasharray="7 4"/>
  <text x="505" y="394" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#862e9c">RTC 路线（12.4）：编译从「开发期」搬到「运行时」——aclrtc 传同一套 bisheng 选项现场编译，</text>
  <text x="505" y="414" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#862e9c">产出的 Device ELF 走同一个 binary_loader 加载链（终点汇合）</text>

  <!-- 底部要点 -->
  <rect x="40" y="460" width="860" height="66" rx="10" fill="#f4f5f6" stroke="#adb5bd" stroke-width="1.2"/>
  <text x="470" y="486" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">为什么分三路？——第2章的硬件分工在编译期的投影：每路二进制对应一类执行单元的指令集，</text>
  <text x="470" y="506" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">Fatbin 打包多架构产物供运行时按真机挑选；--npu-arch 决定「编给谁」，选错 = 真机不认</text>
</svg>
