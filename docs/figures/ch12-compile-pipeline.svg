<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 592 516" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#495057"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1971c2"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f9e63"/>
    </marker>
  </defs>
  <text x="296" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">从 .asc 到可执行：bisheng 异构编译流水线（AI Core SIMD）</text>

  <!-- 源码 -->
  <rect x="36" y="40" width="250" height="40" rx="8" fill="#f4f5f6" stroke="#4263eb" stroke-width="1.5"/>
  <text x="161" y="64" text-anchor="middle" font-size="12.5" fill="#1f2937">main.cpp（Host）</text>
  <rect x="306" y="40" width="250" height="40" rx="8" fill="#f4f5f6" stroke="#e8590c" stroke-width="1.5"/>
  <text x="431" y="64" text-anchor="middle" font-size="12.5" fill="#1f2937">add_kernel.asc（Host/Device 混合）</text>
  <path d="M161 80 L271 104" stroke="#4263eb" stroke-width="1.8" fill="none" marker-end="url(#arrb)"/>
  <path d="M431 80 L321 104" stroke="#e8590c" stroke-width="1.8" fill="none" marker-end="url(#arro)"/>

  <!-- bisheng -->
  <rect x="171" y="104" width="250" height="56" rx="10" fill="#eef2fb" stroke="#4263eb" stroke-width="2"/>
  <text x="296" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#1971c2">bisheng：三路分编译</text>
  <text x="296" y="148" text-anchor="middle" font-size="12" fill="#495057">--npu-arch 选定目标架构</text>
  <path d="M256 160 L120 192" stroke="#4263eb" stroke-width="1.8" fill="none" marker-end="url(#arrb)"/>
  <path d="M296 160 L296 192" stroke="#495057" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  <path d="M336 160 L472 192" stroke="#2f9e63" stroke-width="1.8" fill="none" marker-end="url(#arrg)"/>

  <!-- 三路二进制 -->
  <rect x="20" y="192" width="170" height="44" rx="8" fill="#fdf0e5" stroke="#e8590c" stroke-width="1.5"/>
  <text x="105" y="218" text-anchor="middle" font-size="12.5" fill="#1f2937">Cube 二进制</text>
  <rect x="211" y="192" width="170" height="44" rx="8" fill="#e8f4ec" stroke="#2f9e63" stroke-width="1.5"/>
  <text x="296" y="218" text-anchor="middle" font-size="12.5" fill="#1f2937">Vector 二进制</text>
  <rect x="402" y="192" width="170" height="44" rx="8" fill="#eef2fb" stroke="#4263eb" stroke-width="1.5"/>
  <text x="487" y="218" text-anchor="middle" font-size="12.5" fill="#1f2937">Host 二进制</text>

  <!-- Fatbin -->
  <rect x="171" y="264" width="250" height="48" rx="10" fill="#fff7e6" stroke="#e8590c" stroke-width="1.6"/>
  <text x="296" y="292" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f2937">Fatbin＝Cube＋Vector 先链接</text>
  <path d="M105 236 L240 262" stroke="#e8590c" stroke-width="1.8" fill="none" marker-end="url(#arro)"/>
  <path d="M296 236 L296 264" stroke="#2f9e63" stroke-width="1.8" fill="none" marker-end="url(#arrg)"/>

  <!-- 可执行 -->
  <rect x="146" y="340" width="300" height="76" rx="10" fill="#e8f4ec" stroke="#2f9e63" stroke-width="1.8"/>
  <text x="296" y="366" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">可执行＝完整交付物</text>
  <text x="296" y="386" text-anchor="middle" font-size="12" fill="#495057">Fatbin 并入 Host 二进制</text>
  <text x="296" y="404" text-anchor="middle" font-size="12" fill="#495057">.so/.a 经链接承载（12.3）</text>
  <path d="M296 312 L296 340" stroke="#e8590c" stroke-width="1.8" fill="none" marker-end="url(#arro)"/>
  <path d="M487 236 L487 378 L454 378" stroke="#4263eb" stroke-width="1.8" fill="none" marker-end="url(#arrb)"/>
  <text x="497" y="300" text-anchor="start" font-size="12" fill="#4263eb">不经 Fatbin</text>

  <!-- RTC 独立路线 -->
  <text x="20" y="452" text-anchor="start" font-size="12.5" font-weight="bold" fill="#862e9c">RTC 路线（12.4，独立于上链）</text>
  <rect x="20" y="462" width="170" height="44" rx="8" fill="#f8f0fc" stroke="#9c36b5" stroke-width="1.5"/>
  <text x="105" y="488" text-anchor="middle" font-size="12" fill="#862e9c">运行时 aclrtc 编译</text>
  <rect x="214" y="462" width="140" height="44" rx="8" fill="#f8f0fc" stroke="#9c36b5" stroke-width="1.5"/>
  <text x="284" y="488" text-anchor="middle" font-size="12" fill="#862e9c">独立 Device ELF</text>
  <rect x="398" y="462" width="174" height="44" rx="8" fill="#f8f0fc" stroke="#9c36b5" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="485" y="488" text-anchor="middle" font-size="12" fill="#862e9c">显式加载并启动（第5章）</text>
  <path d="M194 484 L210 484" stroke="#9c36b5" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  <path d="M358 484 L394 484" stroke="#9c36b5" stroke-width="1.8" stroke-dasharray="6 4" fill="none" marker-end="url(#arr)"/>
</svg>
