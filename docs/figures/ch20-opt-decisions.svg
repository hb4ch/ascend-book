<svg xmlns="http://www.w3.org/2000/svg" width="920" height="330" viewBox="0 0 920 330" font-family="'PingFang SC',sans-serif">
<text x="460" y="24" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">三个优化决策＝同一原理（访问模式×存储拓扑）的三个层面</text>
<g font-size="12">
<rect x="20" y="50" width="270" height="70" rx="8" fill="#eef1fb" stroke="#4263eb"/>
<text x="155" y="72" text="A" text-anchor="middle" font-weight="bold" fill="#4263eb"/><text x="40" y="72">决策① UB 写布局</text>
<text x="40" y="90" font-size="10">Copy stride 144→145＋950 bank8 偏移</text>
<text x="40" y="105" font-size="10">层：SIMD Copy/Reg · 对象：UB bank group</text>
<rect x="330" y="50" width="270" height="70" rx="8" fill="#eef7f1" stroke="#2f9e63"/>
<text x="352" y="72">决策② 核间读序与 L2 工作集</text>
<text x="350" y="90" font-size="10">组内置换 (idx+b)%N＋N 切份复用</text>
<text x="350" y="105" font-size="10">层：多核 GM/L2 · 前提：只读＋整除</text>
<rect x="640" y="50" width="260" height="70" rx="8" fill="#fdf1e7" stroke="#e8590c"/>
<text x="660" y="72">决策③ SIMT 线程映射</text>
<text x="660" y="90" font-size="10">warp 内连续化（case2→3 索引映射）</text>
<text x="660" y="105" font-size="10">层：SIMT UB 访问 · 负结果 case2 入册</text>
</g>
<g font-size="11">
<rect x="120" y="160" width="680" height="54" rx="8" fill="#f3eefb" stroke="#9c36b5"/>
<text x="140" y="182">分别建模：UB 核验 bank/group 落点；GM/L2 核验读序与工作集</text>
<text x="140" y="200" font-size="10">地址核验不能预测周期；L2 缓存与 UB bank 冲突使用不同模型和观测指标</text>
<rect x="120" y="240" width="330" height="60" rx="8" fill="#eef7f1" stroke="#2f9e63"/>
<text x="140" y="262">验证五元组：改前码/改后码/机理/代价/验证</text>
<text x="140" y="280" font-size="10">verify 先行 · msopprof 列随层换（MTE vs VEC）· 置信三级</text>
<rect x="470" y="240" width="330" height="60" rx="8" fill="#fdf1e7" stroke="#e8590c"/>
<text x="490" y="262">闸门：指令选择先读 API 约束（通路/dtype/平台）</text>
<text x="490" y="280" font-size="10">MX=950 独立闸 · 稀疏=4:2 int8 链 · 压缩比计 scale/packing</text>
</g>
<path d="M155,120 L155,160 M465,120 L465,160 M770,120 L770,160" stroke="#666" fill="none"/>
<text x="20" y="322" font-size="10" fill="#999">示意：结构关系非流程图；数字见正文表格与 validation/ch20-bank-sim.log。</text>
</svg>