<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#495057"/>
    </marker>
  </defs>
  <text x="450" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">用户态 / 内核态驱动分层边界（第6章）</text>
  <text x="450" y="46" text-anchor="middle" font-size="11" fill="#6b7280">用户态 runtime 负责「翻译/排队/管资源」，内核态驱动负责「摸到硬件」</text>

  <!-- 用户态容器 -->
  <rect x="60" y="66" width="640" height="270" rx="12" fill="#f2faf5" stroke="#2f9e63" stroke-width="2"/>
  <text x="80" y="90" font-size="13" font-weight="bold" fill="#2f9e63">用户态（你的进程内）</text>
  <g font-size="12" fill="#1f2937">
    <rect x="90" y="104" width="580" height="52" rx="8" fill="#e8f4ec" stroke="#2f9e63" stroke-width="1.5"/>
    <text x="380" y="126" text-anchor="middle" font-weight="bold">应用层：AI 框架（PyTorch/MindSpore）· 算子库 · HCCL 通信库</text>
    <text x="380" y="146" text-anchor="middle" font-size="11" fill="#495057">aclnn / ACL 程序（第4章）</text>
    <rect x="90" y="172" width="580" height="52" rx="8" fill="#e8f4ec" stroke="#2f9e63" stroke-width="1.5"/>
    <text x="380" y="194" text-anchor="middle" font-weight="bold">CANN Runtime（用户态动态库）：libacl_rt.so · libruntime.so(.so 版本变体)</text>
    <text x="380" y="214" text-anchor="middle" font-size="11" fill="#495057">翻译 / 排队 / 管资源 —— 第5章的 api/ + core/ + queue_schedule/</text>
    <rect x="90" y="240" width="580" height="52" rx="8" fill="#e8f4ec" stroke="#2f9e63" stroke-width="1.5"/>
    <text x="380" y="262" text-anchor="middle" font-weight="bold">驱动适配层（差异屏蔽）：driver/v100 · driver/v200 · config/ 芯片特性配置</text>
    <text x="380" y="282" text-anchor="middle" font-size="11" fill="#495057">ascend_hal.h = 统一 HAL 驱动调用入口；上层 core/ 不必关心底下是 910 还是 950</text>
  </g>
  <line x1="380" y1="156" x2="380" y2="172" stroke="#495057" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="380" y1="224" x2="380" y2="240" stroke="#495057" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 边界线 -->
  <rect x="60" y="352" width="640" height="44" rx="8" fill="#fff" stroke="#c92a2a" stroke-width="1.8" stroke-dasharray="9 5"/>
  <text x="380" y="370" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#c92a2a">系统调用边界：/dev/davinci0…7 设备文件（ioctl）</text>
  <text x="380" y="388" text-anchor="middle" font-size="11" fill="#c92a2a">用户态 runtime 把请求交给内核态驱动 —— 本章只能看到这一层「护照面」</text>
  <line x1="380" y1="292" x2="380" y2="352" stroke="#495057" stroke-width="2" marker-end="url(#arr)"/>
  <text x="398" y="330" font-size="10.5" fill="#6b7280">HAL 请求</text>

  <!-- 内核态 -->
  <rect x="60" y="412" width="640" height="66" rx="12" fill="#eef2fb" stroke="#4263eb" stroke-width="2"/>
  <text x="80" y="436" font-size="13" font-weight="bold" fill="#4263eb">内核态</text>
  <text x="380" y="442" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f2937">Ascend Driver：ascend_km 内核模块</text>
  <text x="380" y="462" text-anchor="middle" font-size="11" fill="#495057">地址空间 / 内存映射 / 中断与队列投递的真实执行者</text>
  <line x1="380" y1="396" x2="380" y2="412" stroke="#495057" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 硬件 -->
  <rect x="60" y="494" width="640" height="48" rx="12" fill="#fdf0e5" stroke="#e8590c" stroke-width="2"/>
  <text x="380" y="524" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1f2937">Ascend NPU 硬件：AI Core · AI CPU · CCU（910 / 310P / 950 / A2 / A3）</text>
  <line x1="380" y1="478" x2="380" y2="494" stroke="#495057" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 右侧注记 -->
  <g font-size="11.5" fill="#1f2937">
    <rect x="726" y="104" width="158" height="96" rx="8" fill="#fceff1" stroke="#c92a2a" stroke-width="1.3"/>
    <text x="805" y="126" text-anchor="middle" font-weight="bold" fill="#c92a2a">写作边界（§8）</text>
    <text x="805" y="146" text-anchor="middle" font-size="10.5">内核驱动源码不在开源仓</text>
    <text x="805" y="164" text-anchor="middle" font-size="10.5">本章按「分层+边界+API」</text>
    <text x="805" y="182" text-anchor="middle" font-size="10.5">级写作，仿真结论需真机</text>
    <rect x="726" y="220" width="158" height="96" rx="8" fill="#f4f5f6" stroke="#adb5bd" stroke-width="1.3"/>
    <text x="805" y="242" text-anchor="middle" font-weight="bold">跨进程约束（6.6）</text>
    <text x="805" y="262" text-anchor="middle" font-size="10.5">进程间默认隔离</text>
    <text x="805" y="280" text-anchor="middle" font-size="10.5">共享需显式声明</text>
    <text x="805" y="298" text-anchor="middle" font-size="10.5">（IPC / MemGrp，6.3.1）</text>
    <rect x="726" y="336" width="158" height="88" rx="8" fill="#f4f5f6" stroke="#adb5bd" stroke-width="1.3"/>
    <text x="805" y="358" text-anchor="middle" font-weight="bold">仿真路径（6.5）</text>
    <text x="805" y="378" text-anchor="middle" font-size="10.5">CModel 驱动：无真机时</text>
    <text x="805" y="396" text-anchor="middle" font-size="10.5">的功能级仿真通道</text>
  </g>
</svg>
