<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 840" font-family="PingFang SC,Microsoft YaHei,sans-serif">
<rect width="960" height="840" fill="#f8fafc"/>
<text x="24" y="44" font-size="26" font-weight="bold" fill="#111827">softmax 六级阶梯（官方 cycles，同文件 #if SCENARIO_NUM）</text>
<text x="24" y="78" font-size="19" fill="#475569">读法：每级=diff 上一级；逐级开销见各级「消灭」栏（真码 softmax.asc）</text>
<rect x="24" y="120" width="912" height="88" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="44" y="154" font-size="21" font-weight="bold" fill="#111827">Case 0 · MemBase</text>
<text x="44" y="184" font-size="20" fill="#334155">四步全落 UB，中间结果反复搬运</text>
<text x="630" y="160" font-size="24" font-weight="bold" fill="#0f766e">44113</text>
<text x="630" y="186" font-size="19" fill="#64748b">cycles · 基线 1×</text>
<text x="820" y="172" font-size="19" fill="#94a3b8">softmax.asc</text>
<text x="480.0" y="224" font-size="19" fill="#94a3b8" text-anchor="middle">↓ 消灭上一级冗余</text>
<rect x="24" y="224" width="912" height="88" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="44" y="258" font-size="21" font-weight="bold" fill="#111827">Case 1 · RegBase</text>
<text x="44" y="288" font-size="20" fill="#334155">寄存器化，exp/sum 仍落 UB 读回（+34%）</text>
<text x="630" y="264" font-size="24" font-weight="bold" fill="#0f766e">31894</text>
<text x="630" y="290" font-size="19" fill="#64748b">cycles · 1.4×</text>
<text x="820" y="276" font-size="19" fill="#94a3b8">softmax.asc</text>
<text x="480.0" y="328" font-size="19" fill="#94a3b8" text-anchor="middle">↓ 消灭上一级冗余</text>
<rect x="24" y="328" width="912" height="88" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
<text x="44" y="362" font-size="21" font-weight="bold" fill="#111827">Case 2 · 四循环流水 ★</text>
<text x="44" y="392" font-size="20" fill="#334155">ExpSub 并发 / max 不落 UB / Bar 收敛</text>
<text x="630" y="368" font-size="24" font-weight="bold" fill="#0f766e">3413</text>
<text x="630" y="394" font-size="19" fill="#64748b">cycles · 12.9× 最大跳变</text>
<text x="820" y="380" font-size="19" fill="#94a3b8">softmax.asc</text>
<text x="480.0" y="432" font-size="19" fill="#94a3b8" text-anchor="middle">↓ 消灭上一级冗余</text>
<rect x="24" y="432" width="912" height="88" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="44" y="466" font-size="21" font-weight="bold" fill="#111827">Case 3 · 外层展开</text>
<text x="44" y="496" font-size="20" fill="#334155">双份寄存器交错，造无依赖对</text>
<text x="630" y="472" font-size="24" font-weight="bold" fill="#0f766e">2197</text>
<text x="630" y="498" font-size="19" fill="#64748b">cycles · 20.1×</text>
<text x="820" y="484" font-size="19" fill="#94a3b8">softmax.asc</text>
<text x="480.0" y="536" font-size="19" fill="#94a3b8" text-anchor="middle">↓ 消灭上一级冗余</text>
<rect x="24" y="536" width="912" height="88" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="44" y="570" font-size="21" font-weight="bold" fill="#111827">Case 4 · 主尾块</text>
<text x="44" y="600" font-size="20" fill="#334155">主循环免掩码；单独不赚，为展开铺路</text>
<text x="630" y="576" font-size="24" font-weight="bold" fill="#0f766e">3424</text>
<text x="630" y="602" font-size="19" fill="#64748b">cycles · 对 Case2 周期略增</text>
<text x="820" y="588" font-size="19" fill="#94a3b8">softmax.asc</text>
<text x="480.0" y="640" font-size="19" fill="#94a3b8" text-anchor="middle">↓ 消灭上一级冗余</text>
<rect x="24" y="640" width="912" height="88" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="44" y="674" font-size="21" font-weight="bold" fill="#111827">Case 5 · 全家桶</text>
<text x="44" y="704" font-size="20" fill="#334155">主尾块＋展开＋ExpSub 叠加</text>
<text x="630" y="680" font-size="24" font-weight="bold" fill="#0f766e">1785</text>
<text x="630" y="706" font-size="19" fill="#64748b">cycles · 24.7× 最优</text>
<text x="820" y="692" font-size="19" fill="#94a3b8">softmax.asc</text>
<text x="24" y="812" font-size="19" fill="#64748b">顺序铁律：先定轮次（Case4）→ 再展开（Case3）→ 融合贯穿；数字为官方基准，本书未复测</text>
</svg>