<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 592 620" font-family="PingFang SC,Microsoft YaHei,sans-serif">
  <rect width="592" height="620" fill="#f8fafc"/>
  <defs><marker id="arrP" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#9c36b5"/></marker></defs>
  <text x="20" y="32" font-size="16" font-weight="bold" fill="#111827">搬运怎么走：两行各走各的，单元标在边上</text>
  <text x="20" y="52" font-size="12" fill="#64748b">段间依赖须显式同步（第9/10章）；重复框＝同一存储</text>

  <!-- 矩阵行 -->
  <text x="20" y="80" font-size="14" font-weight="bold" fill="#1e3a8a">矩阵（Cube）行</text>
  <rect x="20" y="92" width="100" height="44" rx="6" fill="#fef3c7" stroke="#e8590c"/>
  <text x="70" y="112" font-size="13" text-anchor="middle" fill="#7c2d12">GM 输入</text>
  <text x="70" y="128" font-size="12" text-anchor="middle" fill="#9a3412">同一 GM</text>
  <rect x="170" y="92" width="72" height="44" rx="6" fill="#dbeafe" stroke="#4263eb"/>
  <text x="206" y="118" font-size="14" text-anchor="middle" fill="#1e3a8a">L1</text>
  <rect x="292" y="92" width="86" height="44" rx="6" fill="#dbeafe" stroke="#4263eb"/>
  <text x="335" y="112" font-size="13" text-anchor="middle" fill="#1e3a8a">L0A / L0B</text>
  <text x="335" y="128" font-size="12" text-anchor="middle" fill="#64748b">512B 对齐</text>
  <rect x="428" y="92" width="60" height="44" rx="6" fill="#dbeafe" stroke="#4263eb"/>
  <text x="458" y="118" font-size="14" text-anchor="middle" fill="#1e3a8a">Cube</text>
  <rect x="508" y="92" width="64" height="44" rx="6" fill="#dbeafe" stroke="#4263eb"/>
  <text x="540" y="112" font-size="13" text-anchor="middle" fill="#1e3a8a">L0C</text>
  <text x="540" y="128" font-size="12" text-anchor="middle" fill="#64748b">64B 对齐</text>
  <line x1="120" y1="114" x2="168" y2="114" stroke="#4263eb" stroke-width="2"/>
  <text x="144" y="106" font-size="12" text-anchor="middle" fill="#4263eb">MTE2 搬入</text>
  <line x1="242" y1="114" x2="290" y2="114" stroke="#4263eb" stroke-width="2"/>
  <text x="266" y="106" font-size="12" text-anchor="middle" fill="#4263eb">MTE1</text>
  <line x1="378" y1="114" x2="426" y2="114" stroke="#4263eb" stroke-width="2"/>
  <text x="402" y="106" font-size="12" text-anchor="middle" fill="#64748b">矩阵输入</text>
  <line x1="488" y1="114" x2="506" y2="114" stroke="#4263eb" stroke-width="2"/>
  <text x="497" y="106" font-size="12" text-anchor="middle" fill="#64748b">结果</text>
  <path d="M 540 136 L 540 156 L 70 156 L 70 140" fill="none" stroke="#9c36b5" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arrP)"/>
  <text x="315" y="150" font-size="12" text-anchor="middle" fill="#9c36b5">FixPipe 收尾：随路格式/分形转换（→GM 或 →L1，2201 起 Fixpipe 可硬件化）</text>
  <rect x="60" y="158" width="100" height="0" fill="none"/>

  <!-- 向量行 -->
  <text x="20" y="208" font-size="14" font-weight="bold" fill="#14532d">向量（Vector）行</text>
  <rect x="20" y="220" width="100" height="44" rx="6" fill="#fef3c7" stroke="#e8590c"/>
  <text x="70" y="240" font-size="13" text-anchor="middle" fill="#7c2d12">GM 输入</text>
  <text x="70" y="256" font-size="12" text-anchor="middle" fill="#9a3412">同一 GM</text>
  <rect x="200" y="220" width="100" height="44" rx="6" fill="#ebfbee" stroke="#2f9e63"/>
  <text x="250" y="240" font-size="13" text-anchor="middle" fill="#14532d">UB 输入</text>
  <text x="250" y="256" font-size="12" text-anchor="middle" fill="#64748b">32B 对齐</text>
  <rect x="380" y="220" width="72" height="44" rx="6" fill="#ebfbee" stroke="#2f9e63"/>
  <text x="416" y="246" font-size="14" text-anchor="middle" fill="#14532d">Vector</text>
  <rect x="200" y="300" width="100" height="44" rx="6" fill="#ebfbee" stroke="#2f9e63"/>
  <text x="250" y="320" font-size="13" text-anchor="middle" fill="#14532d">UB 输出</text>
  <text x="250" y="336" font-size="12" text-anchor="middle" fill="#64748b">同一 UB</text>
  <rect x="380" y="300" width="100" height="44" rx="6" fill="#fef3c7" stroke="#e8590c"/>
  <text x="430" y="320" font-size="13" text-anchor="middle" fill="#7c2d12">GM 输出</text>
  <text x="430" y="336" font-size="12" text-anchor="middle" fill="#9a3412">同一 GM</text>
  <line x1="120" y1="242" x2="198" y2="242" stroke="#2f9e63" stroke-width="2"/>
  <text x="159" y="234" font-size="12" text-anchor="middle" fill="#2f9e63">MTE2 搬入</text>
  <line x1="300" y1="242" x2="378" y2="242" stroke="#2f9e63" stroke-width="2"/>
  <text x="339" y="234" font-size="12" text-anchor="middle" fill="#2f9e63">Vector 读取</text>
  <line x1="416" y1="264" x2="416" y2="290" stroke="#2f9e63" stroke-width="1.4"/>
  <text x="432" y="281" font-size="12" fill="#64748b">结果写回</text>
  <line x1="300" y1="322" x2="378" y2="322" stroke="#2f9e63" stroke-width="2"/>
  <text x="339" y="314" font-size="12" text-anchor="middle" fill="#2f9e63">MTE3 搬出</text>
  <text x="70" y="290" font-size="12" fill="#64748b">同一 GM（重复框=同一存储）</text>

  <!-- 底注 -->
  <text x="20" y="386" font-size="12" fill="#64748b">读法：按算子类型走对应一行，箭头=数据就位次序；两行可并存于同一 kernel（混合见 11.3）。</text>
  <text x="20" y="408" font-size="12" fill="#64748b">本图只画两代共同主干；UB↔L1、L0C→UB 等 3510 增删见正文 8.2 证据表——未画≠不存在。</text>
  <text x="20" y="430" font-size="12" fill="#64748b">对齐数字为 2201 架构存储表属性；接口约束逐接口查文档。</text>
  <text x="20" y="452" font-size="12" fill="#64748b">GM→L0A/B 与 L1→GM 在 3510 已删（正文表）；L1→GM 图中为 2201 形态。</text>
</svg>
