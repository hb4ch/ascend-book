<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#495057"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9c36b5"/>
    </marker>
  </defs>
  <text x="460" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">runtime 模块组织：前台 → 厨房 → 传菜 → 片侧（第5章）</text>
  <text x="460" y="46" text-anchor="middle" font-size="11" fill="#6b7280">实线 = 数据面（SQE 订单流）；虚线 = 控制面（CtrlSQ：查询 / 取消 / 资源增删）</text>

  <!-- 数据面主链 -->
  <g font-size="12" fill="#1f2937">
    <rect x="40"  y="90" width="170" height="96" rx="10" fill="#e8f4ec" stroke="#2f9e63" stroke-width="1.5"/>
    <text x="125" y="114" text-anchor="middle" font-weight="bold" font-size="13">api/ · 前台</text>
    <text x="125" y="134" text-anchor="middle" font-size="11" fill="#495057">收单：aclnnAdd 等</text>
    <text x="125" y="152" text-anchor="middle" font-size="11" fill="#495057">建任务对象</text>
    <text x="125" y="170" text-anchor="middle" font-size="11" fill="#495057">回执：response 分发</text>

    <rect x="270" y="90" width="190" height="96" rx="10" fill="#e8f4ec" stroke="#2f9e63" stroke-width="1.5"/>
    <text x="365" y="114" text-anchor="middle" font-weight="bold" font-size="13">core/ · 厨房</text>
    <text x="365" y="134" text-anchor="middle" font-size="11" fill="#495057">task_to_sqe：g_BufToFunc 分发表</text>
    <text x="365" y="152" text-anchor="middle" font-size="11" fill="#495057">static / dynamic / param 三种 SQE</text>
    <text x="365" y="170" text-anchor="middle" font-size="11" fill="#495057">stream 管理 · binary_loader</text>

    <rect x="520" y="90" width="180" height="96" rx="10" fill="#fff7e6" stroke="#e8930c" stroke-width="1.5"/>
    <text x="610" y="114" text-anchor="middle" font-weight="bold" font-size="13">queue_schedule/ · 传菜</text>
    <text x="610" y="134" text-anchor="middle" font-size="11" fill="#495057">BQS 队列（满柜响铃）</text>
    <text x="610" y="152" text-anchor="middle" font-size="11" fill="#495057">SQ 环 + doorbell</text>
    <text x="610" y="170" text-anchor="middle" font-size="11" fill="#495057">状态机：idle/full/peek…</text>

    <rect x="760" y="90" width="140" height="96" rx="10" fill="#fdf0e5" stroke="#e8590c" stroke-width="1.5"/>
    <text x="830" y="114" text-anchor="middle" font-weight="bold" font-size="13">tsd/ · 片侧</text>
    <text x="830" y="134" text-anchor="middle" font-size="11" fill="#495057">TSD 进程/线程两模式</text>
    <text x="830" y="152" text-anchor="middle" font-size="11" fill="#495057">取单 → 派发到核</text>
    <text x="830" y="170" text-anchor="middle" font-size="11" fill="#495057">回执回 api</text>
  </g>

  <line x1="210" y1="138" x2="270" y2="138" stroke="#495057" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="460" y1="138" x2="520" y2="138" stroke="#495057" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="700" y1="138" x2="760" y2="138" stroke="#495057" stroke-width="2" marker-end="url(#arr)"/>
  <text x="235" y="126" text-anchor="middle" font-size="10.5" fill="#6b7280">任务对象</text>
  <text x="490" y="126" text-anchor="middle" font-size="10.5" fill="#6b7280">投入 SQE</text>
  <text x="730" y="126" text-anchor="middle" font-size="10.5" fill="#6b7280">doorbell</text>

  <!-- AI Core -->
  <rect x="760" y="240" width="140" height="46" rx="10" fill="#fcefe9" stroke="#c2410c" stroke-width="1.5"/>
  <text x="830" y="268" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f2937">AI Core 执行</text>
  <line x1="830" y1="186" x2="830" y2="240" stroke="#495057" stroke-width="2" marker-end="url(#arr)"/>
  <text x="846" y="218" font-size="10.5" fill="#6b7280">派发</text>

  <!-- 控制面 -->
  <rect x="40" y="320" width="860" height="64" rx="10" fill="#f8f0fc" stroke="#9c36b5" stroke-width="1.5" stroke-dasharray="7 4"/>
  <text x="470" y="346" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#862e9c">控制面 CtrlSQ（5.7）：ctrl_sq.cc —— 查询进度 / 取消任务 / 流与事件等资源的建、删、改</text>
  <text x="470" y="368" text-anchor="middle" font-size="11" fill="#862e9c">与数据面各占一条道：普通订单走 SQ，管理指令走 CtrlSQ，互不阻塞</text>
  <path d="M125 186 L125 320" stroke="#9c36b5" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrb)"/>
  <path d="M830 286 L830 320" stroke="#9c36b5" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrb)"/>

  <!-- 两个辅助区 -->
  <g font-size="12" fill="#1f2937">
    <rect x="270" y="420" width="290" height="60" rx="10" fill="#f4f5f6" stroke="#adb5bd" stroke-width="1.2"/>
    <text x="415" y="444" text-anchor="middle" font-weight="bold">aicpu_sched/ · AICPU 调度（5.1.1）</text>
    <text x="415" y="464" text-anchor="middle" font-size="11" fill="#495057">算子逃逸到 AI CPU 执行时的调度通道（第11章）</text>
    <rect x="610" y="420" width="290" height="60" rx="10" fill="#f4f5f6" stroke="#adb5bd" stroke-width="1.2"/>
    <text x="755" y="444" text-anchor="middle" font-weight="bold">tprt/ · 传输运行层（5.1.1）</text>
    <text x="755" y="464" text-anchor="middle" font-size="11" fill="#495057">跨设备数据搬运的底层通道（第8章零拷贝 / 第18章）</text>
  </g>
  <path d="M365 186 L365 420" stroke="#adb5bd" stroke-width="1.4" stroke-dasharray="4 3"/>
  <path d="M610 186 C560 260 640 340 755 420" stroke="#adb5bd" stroke-width="1.4" stroke-dasharray="4 3" fill="none"/>
  <text x="70" y="500" font-size="11" fill="#6b7280">八个大步里只有最后两步在「真算」——其余都是翻译、排队、派发（5.8 完整路径）。</text>
</svg>
