<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs>
  <text x="320" y="24" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#111827">SIMT 硬件组成与线程执行（950 · dav-3510）</text>
  <text x="320" y="44" text-anchor="middle" font-size="11.5" fill="#6b7280">AIV 内的 SIMT 组成与线程行为示意</text>
  <rect x="16" y="60" width="424" height="272" rx="12" fill="#f2faf5" stroke="#2f9e63" stroke-width="2"/>
  <text x="32" y="84" font-size="13" font-weight="bold" fill="#2f9e63">AIV 内 SIMT 单元（组成，11.2）</text>
  <rect x="36" y="96" width="150" height="58" rx="8" fill="#e8f4ec" stroke="#2f9e63" stroke-width="1.5"/>
  <text x="111" y="118" text-anchor="middle" font-size="13" font-weight="bold">Warp Scheduler</text>
  <text x="111" y="138" text-anchor="middle" font-size="10.5">发射指令·掩蔽线程束</text>
  <rect x="36" y="166" width="150" height="58" rx="8" fill="#e7f0fa" stroke="#1971c2" stroke-width="1.5"/>
  <text x="111" y="188" text-anchor="middle" font-size="13" font-weight="bold">DCache</text>
  <text x="111" y="208" text-anchor="middle" font-size="10.5">服务 GM 离散读（特性表）</text>
  <rect x="36" y="236" width="150" height="58" rx="8" fill="#f3e8fd" stroke="#9c36b5" stroke-width="1.5"/>
  <text x="111" y="258" text-anchor="middle" font-size="13" font-weight="bold">Register File</text>
  <text x="111" y="278" font-size="10.5" text-anchor="middle">线程寄存器</text>
  <rect x="210" y="96" width="210" height="46" rx="6" fill="#fff" stroke="#2f9e63" stroke-width="1.3"/><text x="315" y="118" text-anchor="middle" font-size="12">thread 0 · thread 1</text>
  <rect x="210" y="150" width="210" height="46" rx="6" fill="#fff" stroke="#2f9e63" stroke-width="1.3" stroke-dasharray="5 3"/><text x="315" y="172" text-anchor="middle" font-size="12" fill="#adb5bd">thread 2（掩蔽）· …</text>
  <text x="315" y="216" text-anchor="middle" font-size="11.5">分支发散：分批执行与掩蔽</text>
  <text x="315" y="236" text-anchor="middle" font-size="11.5">支持 if/else 与 return</text>
  <text x="315" y="262" text-anchor="middle" font-size="11.5" fill="#495057">一个 VF 对应一个线程块</text>
  <text x="315" y="282" text-anchor="middle" font-size="11.5" fill="#495057">块内协作范围见正文</text>
  <rect x="16" y="344" width="424" height="56" rx="8" fill="#fff7e6" stroke="#e8590c" stroke-width="1.5"/>
  <text x="228" y="366" text-anchor="middle" font-size="13" font-weight="bold">__ubuf__：SIMT 的「shared」</text>
  <text x="228" y="386" text-anchor="middle" font-size="11">静态定长；动态大小由 SIMT 四槽启动第三槽传入</text>
  <rect x="16" y="412" width="608" height="88" rx="10" fill="#eef2fb" stroke="#4263eb" stroke-width="1.4"/>
  <text x="320" y="436" text-anchor="middle" font-size="12.5" font-weight="bold">host：hello_world&lt;&lt;&lt;blocks, threads, dyn_ubuf_size, stream&gt;&gt;&gt;（SIMT 四槽）</text>
  <text x="320" y="458" text-anchor="middle" font-size="11.5">四个启动参数：块数、每块线程数、动态 UB 字节数、流</text>
  <text x="320" y="482" text-anchor="middle" font-size="11.5" fill="#c92a2a">架构边界：SIMT 单元仅 950PR/DT（dav-3510）；A2/A3 无——跨代先查能力菜单（2.5）</text>
  <rect x="452" y="60" width="172" height="272" rx="10" fill="#f4f5f6" stroke="#adb5bd" stroke-width="1.2"/>
  <text x="538" y="84" text-anchor="middle" font-size="13" font-weight="bold">阅读边界</text>
  <text x="464" y="108" font-size="11.5">组成见 950 特性指南</text>
  <text x="464" y="130" font-size="11.5">线程限制见接口文档</text>
  <text x="464" y="152" font-size="11.5">同一线程块在单 AIV</text>
  <text x="464" y="174" font-size="11.5">块内屏障只管块内</text>
  <text x="464" y="196" font-size="11.5">跨块须另核同步方式</text>
  <text x="464" y="218" font-size="11.5">勿假设同 warp 线程</text>
  <text x="464" y="240" font-size="11.5">能够相互等待</text>
  <text x="464" y="266" font-size="11.5" fill="#c92a2a">硬件规格按产品查表</text>
  <text x="464" y="288" font-size="11.5" fill="#c92a2a">来源与限制见本节脚注</text>
  <text x="464" y="314" font-size="11.5"></text>
  <text x="464" y="326" font-size="11.5"></text>
</svg>