<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="PingFang SC,Microsoft YaHei,sans-serif">
<rect width="960" height="660" fill="#f8fafc"/>
<text x="24" y="42" font-size="24" font-weight="bold" fill="#111827">Case 1 vs Case 2：消灭冗余而非全部（softmax 真码）</text>
<rect x="24" y="64" width="912" height="200" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="44" y="96" font-size="20" font-weight="bold" fill="#b45309">Case 1 · 分阶段寄存器实现（31894 cycles）</text>
<text x="44" y="128" font-size="20" fill="#334155">max → sub → exp → sum → div：阶段间通过 UB 传递中间结果</text>
<text x="44" y="158" font-size="20" fill="#334155">sub 与 exp 分两条；每 Phase 后一道 LocalMemBar；中间结果逐段落 UB</text>
<text x="44" y="188" font-size="19" fill="#64748b">寄存器生命周期被 Phase 边界截断——半程 RegBase</text>
<rect x="100" y="280" width="760" height="56" rx="28" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
<text x="480" y="314" font-size="19" font-weight="bold" fill="#0f766e" text-anchor="middle">Case 2 消灭：ExpSub 合一 · max 不落 UB · Bar 5→1</text>
<rect x="24" y="352" width="912" height="236" rx="10" fill="#fff" stroke="#10b981" stroke-width="2"/>
<text x="44" y="384" font-size="20" font-weight="bold" fill="#0f766e">Case 2 · 四循环流水（3413 cycles，9.3×）</text>
<text x="44" y="416" font-size="20" fill="#334155">①max：Load src→Max（不落 UB）→ReduceMax+Duplicate</text>
<text x="44" y="444" font-size="20" fill="#334155">②exp：再 Load src→ExpSub→Store exp　③sum：Load exp→Add→ReduceSum</text>
<text x="44" y="472" font-size="20" fill="#334155">④div：Load exp→Div→Store y；②exp 与③sum 之间一道 LocalMemBar</text>
<text x="44" y="502" font-size="19" fill="#0f766e">src 读 2 次（①②）；exp 落 1 读 2（③④）非只读一次</text>
<text x="44" y="530" font-size="19" fill="#64748b">exp 落 UB=全局归约检查点本实现如此；UpdateMask 每轮续期</text>
<text x="24" y="628" font-size="19" fill="#94a3b8">与图 11-4：彼讲原理、此讲真码；数字为官方基准，本书未复测</text>
</svg>
