<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 592 236" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#495057"/>
    </marker>
  </defs>
  <text x="296" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">端到端算子开发：八站流水线（两行四站）</text>

  <!-- 第一行 -->
  <g font-size="14" font-weight="bold">
    <rect x="18" y="44" width="124" height="52" rx="10" fill="#eef2fb" stroke="#4263eb" stroke-width="2"/>
    <text x="80" y="66" text-anchor="middle" fill="#4263eb">① 需求分析</text>
    <text x="80" y="86" text-anchor="middle" font-size="12" font-weight="normal" fill="#495057">契约与支持域</text>

    <rect x="162" y="44" width="124" height="52" rx="10" fill="#eef2fb" stroke="#4263eb" stroke-width="2"/>
    <text x="224" y="66" text-anchor="middle" fill="#4263eb">② API 选型</text>
    <text x="224" y="86" text-anchor="middle" font-size="12" font-weight="normal" fill="#c92a2a">第9章 9.6</text>

    <rect x="306" y="44" width="124" height="52" rx="10" fill="#e8f4ec" stroke="#2f9e63" stroke-width="2"/>
    <text x="368" y="66" text-anchor="middle" fill="#2f9e63">③ 工程骨架</text>
    <text x="368" y="86" text-anchor="middle" font-size="12" font-weight="normal" fill="#c92a2a">第13章</text>

    <rect x="450" y="44" width="124" height="52" rx="10" fill="#fdf0e5" stroke="#e8590c" stroke-width="2.5"/>
    <text x="512" y="66" text-anchor="middle" fill="#e8590c">④ 核函数实现</text>
    <text x="512" y="86" text-anchor="middle" font-size="12" font-weight="normal" fill="#c92a2a">第10-11章</text>
  </g>

  <!-- 第一行横向箭头 -->
  <path d="M144 70 L158 70" stroke="#495057" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M288 70 L302 70" stroke="#495057" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M432 70 L446 70" stroke="#495057" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 换行连接：④ 下 → ⑤ 上 -->
  <path d="M512 96 V118 H80 V140" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arr)"/>
  <text x="296" y="132" text-anchor="middle" font-size="12" fill="#6b7280">进入下一站（换行）</text>

  <!-- 第二行 -->
  <g font-size="14" font-weight="bold">
    <rect x="18" y="144" width="124" height="52" rx="10" fill="#f6fbf7" stroke="#2f9e63" stroke-width="2"/>
    <text x="80" y="166" text-anchor="middle" fill="#2f9e63">⑤ 编译构建</text>
    <text x="80" y="186" text-anchor="middle" font-size="12" font-weight="normal" fill="#c92a2a">第12章</text>

    <rect x="162" y="144" width="124" height="52" rx="10" fill="#f8f0fc" stroke="#9c36b5" stroke-width="2"/>
    <text x="224" y="166" text-anchor="middle" fill="#862e9c">⑥ 验证调试</text>
    <text x="224" y="186" text-anchor="middle" font-size="12" font-weight="normal" fill="#c92a2a">第7章·第12章</text>

    <rect x="306" y="144" width="124" height="52" rx="10" fill="#fff7e6" stroke="#e8590c" stroke-width="2.5"/>
    <text x="368" y="166" text-anchor="middle" fill="#e8590c">⑦ 性能优化</text>
    <text x="368" y="186" text-anchor="middle" font-size="12" font-weight="normal" fill="#c92a2a">第15-18章</text>

    <rect x="450" y="144" width="124" height="52" rx="10" fill="#e8f4ec" stroke="#2f9e63" stroke-width="2"/>
    <text x="512" y="166" text-anchor="middle" fill="#2f9e63">⑧ 贡献回库</text>
    <text x="512" y="186" text-anchor="middle" font-size="12" font-weight="normal" fill="#c92a2a">第13章</text>
  </g>

  <!-- 第二行横向箭头 -->
  <path d="M144 170 L158 170" stroke="#495057" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M288 170 L302 170" stroke="#495057" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M432 170 L446 170" stroke="#495057" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 底部一行注（大字， debt 详情在正文图注） -->
  <text x="296" y="224" text-anchor="middle" font-size="12" fill="#495057">三笔预支债的兑付点见正文图注；回指第9章决策树（9.6）</text>
</svg>
