<svg xmlns="http://www.w3.org/2000/svg" width="592" height="540" viewBox="0 0 592 540" font-family="'PingFang SC',sans-serif">
<text x="296" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">HCCL/HCOMM：三个证据范围×服务端实现</text>
<text x="296" y="40" text-anchor="middle" font-size="12" fill="#6b7280">①②③为并列证据层（各归各，非调用次序）；下框＝三者各自到达服务端的证据形态，跨层汇流未证</text>

<g>
  <rect x="10" y="52" width="572" height="86" rx="8" fill="#eef1fb" stroke="#4263eb" stroke-width="1.5"/>
  <rect x="10" y="52" width="6" height="86" fill="#4263eb"/>
  <text x="26" y="72" font-size="13.5" font-weight="bold" fill="#4263eb">① Host 公开契约（21.2/21.3）——样例＋comm_mgr_c 接口页</text>
  <text x="26" y="92" font-size="12" fill="#333">Init(RootInfo/Cluster)→AllReduce 入 stream；完成=aclrtSynchronizeStream</text>
  <text x="26" y="110" font-size="12" fill="#333">Barrier=下发对齐；销毁序仅样例正序，不得推广为 API 强制</text>
  <text x="26" y="128" font-size="12" fill="#555">Inner→V2 为 weak 断点 ✂（见②）；Host 无引擎可见性</text>
</g>

<g>
  <rect x="10" y="150" width="572" height="104" rx="8" fill="#eef7f1" stroke="#2f9e63" stroke-width="1.5"/>
  <rect x="10" y="150" width="6" height="104" fill="#2f9e63"/>
  <text x="26" y="170" font-size="13.5" font-weight="bold" fill="#2f9e63">② legacy 内部选路（21.4）——独立案例，不互证</text>
  <text x="26" y="190" font-size="12" fill="#333">hcomm/src/legacy/ascend910 真码（A2&amp;A3 兼容层，明注不持续演进）</text>
  <text x="26" y="208" font-size="12" fill="#333">Communicator::AllReduce(L3089)→ExecOp→SelectAlg(L4649)</text>
  <text x="26" y="226" font-size="12" fill="#333">→资源申请→Orchestrate(L4809)；条件式判定＋HCCL_ALGO 覆写</text>
  <text x="26" y="244" font-size="12" fill="#555">引擎=算法选择产物；不涉 CCU 新路径</text>
</g>

<g>
  <rect x="10" y="266" width="572" height="104" rx="8" fill="#fdf1e7" stroke="#e8590c" stroke-width="1.5"/>
  <rect x="10" y="266" width="6" height="104" fill="#e8590c"/>
  <text x="26" y="286" font-size="13.5" font-weight="bold" fill="#e8590c">③ Device 高阶 API＋服务端实现（21.6）</text>
  <text x="26" y="306" font-size="12" fill="#333">asc-devkit hccl.h＋impl/adv_api/detail/hccl：消息区 Prepare→Commit→Wait/Query</text>
  <text x="26" y="324" font-size="12" fill="#333">3510：AICPU＋CCU 双特化（产品使用页仅 CCU）；2201：仅 AICPU（无 CCU 文件）</text>
  <text x="26" y="342" font-size="12" fill="#555">头注 OnlyAICPU 过窄（已标）；默认 Finalize(sync=true) 才等末任务，false 见正文契约表</text>
  <text x="26" y="360" font-size="12" fill="#555">核型指定=模板二参 HcclServerConfig→InitWorkingFlag（编译期定死）</text>
</g>

<g>
  <rect x="10" y="382" width="572" height="104" rx="8" fill="#f3eefb" stroke="#9c36b5" stroke-width="1.5"/>
  <text x="26" y="402" font-size="13.5" font-weight="bold" fill="#862e9c">服务端执行形态（按范围分立陈述；跨范围汇流不画实线＝未证）</text>
  <text x="26" y="422" font-size="12" fill="#333">①Host 样例确认 stream 完成；不由②legacy 案例推定其实际引擎</text>
  <text x="26" y="440" font-size="12" fill="#333">③消息区→AI CPU（AICPU 特化）或 CCU 特化（Commit 计数＋轮询等待）</text>
  <text x="26" y="458" font-size="12" fill="#333">完成语义三分：①stream 同步／③Wait 同序＋Commit 计数／②notify 配对（一次交接已证）</text>
  <text x="26" y="476" font-size="12" fill="#555">②legacy 选择器产出与③impl 特化是两代两套代码，本书不画互证箭头</text>
</g>

<text x="10" y="506" font-size="12" fill="#555">①→服务端：Host 契约不暴露引擎路由；③→服务端：AICPU 特化即消息区协议本体。</text>
<text x="10" y="526" font-size="12" fill="#999">本书无多机环境：全章 [需真机验证]；框内为已证文件/行号锚，跨框调用须回正文核对证据边界。</text>
</svg>
