<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e63"/></marker>
    <marker id="arrs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1971c2"/></marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/></marker>
  </defs>
  <text x="320" y="24" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#111827">混合双引擎：simt_gather＋simd_adds</text>
  <text x="320" y="44" text-anchor="middle" font-size="12" fill="#6b7280">前提：索引合法、分片固定（per_block=总数/块数）——非通用异常框架</text>
  <rect x="14" y="120" width="96" height="150" rx="10" fill="#fdf0e5" stroke="#e8590c" stroke-width="1.8"/>
  <text x="62" y="186" text-anchor="middle" font-size="15" font-weight="bold">GM</text>
  <text x="62" y="208" text-anchor="middle" font-size="11">input/index</text>
  <text x="62" y="226" text-anchor="middle" font-size="11">output</text>
  <rect x="140" y="70" width="180" height="112" rx="10" fill="#e8f4ec" stroke="#2f9e63" stroke-width="2"/>
  <text x="230" y="92" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#2f9e63">① SIMT gather</text>
  <text x="230" y="110" text-anchor="middle" font-size="10.5">离散读 input[index[idx]]</text>
  <text x="230" y="127" text-anchor="middle" font-size="10.5">三层 return 仅防越界</text>
  <text x="230" y="144" text-anchor="middle" font-size="10.5">（不初始化无效项）</text>
  <text x="230" y="166" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#2f9e63">离散→连续在此完成</text>
  <rect x="368" y="120" width="104" height="150" rx="10" fill="#fff7e6" stroke="#e8590c" stroke-width="1.8"/>
  <text x="420" y="186" text-anchor="middle" font-size="15" font-weight="bold">UB</text>
  <text x="420" y="208" text-anchor="middle" font-size="11">__ubuf__ 交接面</text>
  <rect x="500" y="70" width="126" height="112" rx="10" fill="#e7f0fa" stroke="#1971c2" stroke-width="2"/>
  <text x="563" y="92" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1971c2">② SIMD adds</text>
  <text x="563" y="110" text-anchor="middle" font-size="10.5">mask→load→加标量</text>
  <text x="563" y="127" text-anchor="middle" font-size="10.5">→store 写回</text>
  <text x="563" y="166" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1971c2">寄存器内算</text>
  <path d="M110 190 L140 178" stroke="#2f9e63" stroke-width="2" fill="none" marker-end="url(#arrg)"/><text x="122" y="172" font-size="11" fill="#2f9e63">离散读</text>
  <path d="M320 176 L368 196" stroke="#2f9e63" stroke-width="2" fill="none" marker-end="url(#arrg)"/><text x="366" y="170" text-anchor="end" font-size="11" fill="#2f9e63">按线程号连续写</text>
  <path d="M472 244 L500 182" stroke="#1971c2" stroke-width="2" fill="none" marker-end="url(#arrs)"/>
  <text x="510" y="230" text-anchor="start" font-size="10.5" fill="#1971c2">loadalign</text>
  <path d="M500 168 L472 228" stroke="#1971c2" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#arrs)"/>
  <text x="504" y="196" font-size="10.5" fill="#1971c2">storealign</text>
  <path d="M368 252 C280 320 170 300 116 262" stroke="#e8590c" stroke-width="2" fill="none" marker-end="url(#arro)"/>
  <text x="196" y="322" font-size="12" font-weight="bold" fill="#e8590c">④ copy_ub2gm_align（MTE3）</text>
  <rect x="14" y="360" width="612" height="118" rx="10" fill="#f8f0fc" stroke="#9c36b5" stroke-width="1.4" stroke-dasharray="7 4"/>
  <text x="30" y="388" font-size="13.5" font-weight="bold" fill="#862e9c">两类依赖，两个机制（勿混）</text>
  <text x="30" y="414" font-size="12.5" fill="#495057">A. ①→② 先后：同 AIV 上 VF 队列串行执行</text>
  <text x="30" y="440" font-size="12.5" fill="#495057">B. ②→④ 流水：V 算完才可 MTE3 搬出</text>
  <text x="30" y="464" font-size="12.5" font-weight="bold" fill="#862e9c">③ asc_sync_notify/wait(PIPE_V,PIPE_MTE3)——Set/Wait 同族封装</text>
</svg>