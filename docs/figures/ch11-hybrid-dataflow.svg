<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#495057"/>
    </marker>
    <marker id="arrs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1971c2"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f9e63"/>
    </marker>
    <marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/>
    </marker>
  </defs>
  <text x="460" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">混合编程双引擎数据流：simt_gather + simd_adds（gather_and_adds.asc）</text>
  <text x="460" y="46" text-anchor="middle" font-size="11" fill="#6b7280">SIMT 管「把数据不规则地找齐」，SIMD 管「把数据规整地算完」；UB 是两个引擎的交接面</text>

  <!-- GM -->
  <rect x="40" y="180" width="120" height="190" rx="10" fill="#fdf0e5" stroke="#e8590c" stroke-width="1.8"/>
  <text x="100" y="265" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">GM / HBM</text>
  <text x="100" y="288" text-anchor="middle" font-size="11" fill="#495057">input（大表）</text>
  <text x="100" y="306" text-anchor="middle" font-size="11" fill="#495057">index（下标）</text>
  <text x="100" y="324" text-anchor="middle" font-size="11" fill="#495057">output</text>

  <!-- SIMT 引擎 -->
  <rect x="220" y="120" width="230" height="150" rx="10" fill="#e8f4ec" stroke="#2f9e63" stroke-width="2"/>
  <text x="335" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f9e63">① SIMT VF：simt_gather</text>
  <text x="335" y="168" text-anchor="middle" font-size="10" fill="#495057">asc_vf_call&lt;simt_gather&gt;(dim3(1024), …)</text>
  <text x="335" y="188" text-anchor="middle" font-size="10" fill="#495057">idx = blockIdx×blockDim + threadIdx</text>
  <text x="335" y="206" text-anchor="middle" font-size="10" fill="#495057">离散读 GM：input[index[idx]]</text>
  <text x="335" y="224" text-anchor="middle" font-size="10" fill="#495057">三层越界保护逐层 return（分支自由度）</text>
  <text x="335" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="#2f9e63">离散 → 连续的转换在这里完成</text>

  <!-- UB 交接面 -->
  <rect x="510" y="180" width="150" height="190" rx="10" fill="#fff7e6" stroke="#e8590c" stroke-width="1.8"/>
  <text x="585" y="262" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f2937">UB</text>
  <text x="585" y="284" text-anchor="middle" font-size="11" fill="#495057">extern __ubuf__</text>
  <text x="585" y="302" text-anchor="middle" font-size="11" fill="#495057">float local_output[]</text>
  <text x="585" y="324" text-anchor="middle" font-size="11" font-weight="bold" fill="#e8590c">交接面</text>

  <!-- SIMD 引擎 -->
  <rect x="720" y="120" width="180" height="150" rx="10" fill="#e7f0fa" stroke="#1971c2" stroke-width="2"/>
  <text x="810" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#1971c2">② SIMD VF：simd_adds</text>
  <text x="810" y="168" text-anchor="middle" font-size="10" fill="#495057">asc_vf_call&lt;simd_adds&gt;(…)</text>
  <text x="810" y="188" text-anchor="middle" font-size="10" fill="#495057">for repeat: mask → loadalign</text>
  <text x="810" y="206" text-anchor="middle" font-size="10" fill="#495057">→ asc_add_scalar</text>
  <text x="810" y="224" text-anchor="middle" font-size="10" fill="#495057">→ storealign 写回 UB</text>
  <text x="810" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="#1971c2">连续数据 · 寄存器内加 1</text>

  <!-- 箭头 -->
  <path d="M160 230 L220 210" stroke="#2f9e63" stroke-width="2.2" fill="none" marker-end="url(#arrg)"/>
  <text x="188" y="200" font-size="10.5" fill="#2f9e63">离散读</text>
  <path d="M450 200 L510 230" stroke="#2f9e63" stroke-width="2.2" fill="none" marker-end="url(#arrg)"/>
  <text x="505" y="196" text-anchor="end" font-size="10.5" fill="#2f9e63">按线程号连续写入</text>
  <!-- UB ↔ SIMD：load 去 / store 回，上下错开不交叉 -->
  <path d="M660 330 L718 272" stroke="#1971c2" stroke-width="2.2" fill="none" marker-end="url(#arrs)"/>
  <path d="M720 240 L662 296" stroke="#1971c2" stroke-width="1.6" stroke-dasharray="6 4" fill="none" marker-end="url(#arrs)"/>
  <text x="668" y="348" font-size="10.5" fill="#1971c2">loadalign 读回</text>
  <text x="668" y="364" font-size="10.5" fill="#1971c2">storealign 写回</text>

  <!-- 搬出 -->
  <path d="M510 350 C330 420 220 380 162 346" stroke="#e8590c" stroke-width="2.2" fill="none" marker-end="url(#arro)"/>
  <text x="290" y="412" font-size="11.5" font-weight="bold" fill="#e8590c">④ asc_copy_ub2gm_align（MTE3）</text>

  <!-- 同步点 -->
  <rect x="688" y="290" width="224" height="80" rx="10" fill="#f8f0fc" stroke="#9c36b5" stroke-width="1.6" stroke-dasharray="7 4"/>
  <text x="800" y="316" text-anchor="middle" font-size="12" font-weight="bold" fill="#862e9c">③ 流水同步（显式）</text>
  <text x="800" y="338" text-anchor="middle" font-size="10.5" fill="#862e9c">asc_sync_notify(PIPE_V, PIPE_MTE3)</text>
  <text x="800" y="356" text-anchor="middle" font-size="10.5" fill="#862e9c">asc_sync_wait(PIPE_V, PIPE_MTE3)</text>
  <path d="M810 270 L800 290" stroke="#9c36b5" stroke-width="1.6" stroke-dasharray="4 3" fill="none" marker-end="url(#arr)"/>
  <text x="822" y="286" font-size="10" fill="#862e9c">算完才准搬</text>

  <!-- 底部小结 -->
  <rect x="40" y="446" width="860" height="62" rx="10" fill="#f4f5f6" stroke="#adb5bd" stroke-width="1.2"/>
  <text x="470" y="470" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">编排思想：离散和规整的转换在数据进 UB 的那一刻完成——SIMT 的分支自由度只用于防御（越界保护），</text>
  <text x="470" y="490" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2937">SIMD 的批量能力只用于规整计算；同步（③）不画，搬出就是脏数据（11.4 展开）</text>
</svg>
