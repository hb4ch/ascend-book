<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 592 560" font-family="PingFang SC,Microsoft YaHei,sans-serif">
  <rect width="592" height="560" fill="#f8fafc"/>
  <text x="20" y="34" font-size="17" font-weight="bold" fill="#111827">存储分几类，各归哪条路</text>
  <text x="20" y="56" font-size="12" fill="#64748b">分类图，不是数据流；搬运与单元见图 8-2</text>
  <!-- GM -->
  <rect x="16" y="70" width="560" height="74" rx="8" fill="#fef3c7" stroke="#e8590c" stroke-width="2"/>
  <text x="32" y="96" font-size="15" font-weight="bold" fill="#7c2d12">Global Memory（GM）——Device 侧全局存储（编程视图）</text>
  <text x="32" y="120" font-size="13" fill="#374151">容量大、离算力远；搬入/搬出的主通道；物理介质视产品（常见 HBM，第2章）</text>
  <!-- Local -->
  <rect x="16" y="156" width="560" height="270" rx="8" fill="#eff6ff" stroke="#4263eb" stroke-width="2"/>
  <text x="32" y="182" font-size="15" font-weight="bold" fill="#1e3a8a">Local Memory（AI Core 片内）：容量小、离算力近，按服务的计算单元分两路</text>
  <!-- Cube -->
  <rect x="32" y="194" width="262" height="150" rx="6" fill="#fff" stroke="#4263eb"/>
  <text x="44" y="218" font-size="14" font-weight="bold" fill="#1e3a8a">Cube 路存储</text>
  <text x="44" y="240" font-size="13" fill="#334155">L1（32B）→ L0A/L0B（512B）</text>
  <text x="44" y="261" font-size="13" fill="#334155">→ Cube → L0C（64B）</text>
  <text x="44" y="283" font-size="12" fill="#64748b">矩阵分形排布 ZZ/ZN/NZ</text>
  <text x="44" y="316" font-size="12" fill="#64748b">FixPipe 收尾 L0C→GM/L1</text>
  <!-- Vector -->
  <rect x="298" y="194" width="262" height="150" rx="6" fill="#fff" stroke="#2f9e63"/>
  <text x="310" y="218" font-size="14" font-weight="bold" fill="#14532d">Vector 路存储</text>
  <text x="310" y="240" font-size="13" fill="#334155">UB（32B 访问对齐）</text>
  <text x="310" y="261" font-size="12" fill="#64748b">排布无硬性分形要求</text>
  <text x="310" y="283" font-size="12" fill="#64748b">3510 起：中间结果可驻留</text>
  <text x="310" y="302" font-size="12" fill="#64748b">SIMD 寄存器（11 章）</text>
  <!-- L2 -->
  <rect x="32" y="356" width="528" height="56" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="44" y="378" font-size="12.5" fill="#475569">另有 L2 Cache：经搬运单元读写 GM 的数据缺省被缓存——系统级缓存，不在片内 Local 之列</text>
  <text x="44" y="398" font-size="12" fill="#64748b">CacheLine 128/256/512Byte 随硬件规格（basic_architecture L113/L206）</text>
  <text x="16" y="452" font-size="12" fill="#64748b">容量随型号与编译预留变化（UB/L1 预留 256B 等），用平台信息接口查询，图中不标容量。</text>
  <text x="16" y="474" font-size="12" fill="#64748b">对齐数字为 2201 架构存储表属性；接口约束逐接口查文档（8.2 证据表）。</text>
  <text x="16" y="496" font-size="12" fill="#64748b">SIMT 另有 GM 直读路径；本图分类不覆盖 SIMT 访存细节（11 章）。</text>
</svg>
