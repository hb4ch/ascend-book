<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#495057"/>
    </marker>
    <linearGradient id="mem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3e8fd"/>
      <stop offset="1" stop-color="#dbe4f7"/>
    </linearGradient>
  </defs>
  <text x="450" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#111827">AI Core 存储层级：从「小而快」到「大而慢」（第8章）</text>
  <text x="450" y="46" text-anchor="middle" font-size="11" fill="#6b7280">越往上离算力越近：容量越小、带宽越高、延迟越低；每层都由不同的搬运单元服务（见图 8-2）</text>

  <!-- 左轴注记 -->
  <path d="M120 560 L120 90" stroke="#2f9e63" stroke-width="2" marker-end="url(#arr)"/>
  <text x="100" y="330" font-size="12.5" font-weight="bold" fill="#2f9e63" transform="rotate(-90 100 330)">离算力越近：带宽 ↑ · 延迟 ↓ · 容量 ↓</text>

  <!-- 层级条 -->
  <g font-size="12" fill="#1f2937">
    <rect x="330" y="70"  width="240" height="66" rx="10" fill="#f3e8fd" stroke="#9c36b5" stroke-width="1.6"/>
    <text x="450" y="96" text-anchor="middle" font-weight="bold" font-size="13">寄存器 RegTensor（950 起）</text>
    <text x="450" y="116" text-anchor="middle" font-size="11" fill="#495057">Vector 执行单元最内层，直接喂指令（第10/11章）</text>

    <rect x="300" y="146" width="300" height="66" rx="10" fill="#efe7fd" stroke="#7048e8" stroke-width="1.6"/>
    <text x="450" y="172" text-anchor="middle" font-weight="bold" font-size="13">L0A / L0B / L0C</text>
    <text x="450" y="192" text-anchor="middle" font-size="11" fill="#495057">Cube 的矩阵输入与结果分块；L0C 经 FixPipe 走（图 8-2）</text>

    <rect x="270" y="222" width="360" height="66" rx="10" fill="#e7f0fa" stroke="#1971c2" stroke-width="1.6"/>
    <text x="450" y="248" text-anchor="middle" font-weight="bold" font-size="13">L1 Buffer —— Cube 的「粮仓」</text>
    <text x="450" y="268" text-anchor="middle" font-size="11" fill="#495057">矩阵分片中转：MTE2 搬入、MTE1 喂 L0；矩阵算子先看 L1 利用率</text>

    <rect x="240" y="298" width="420" height="66" rx="10" fill="#e8f4ec" stroke="#2f9e63" stroke-width="1.6"/>
    <text x="450" y="324" text-anchor="middle" font-weight="bold" font-size="13">UB（Unified Buffer）—— Vector 的主场</text>
    <text x="450" y="344" text-anchor="middle" font-size="11" fill="#495057">矢量计算输入/输出分片；Tpipe/TQue 的 AllocTensor 就在这里（第10章）</text>

    <rect x="210" y="374" width="480" height="66" rx="10" fill="#fff7e6" stroke="#e8930c" stroke-width="1.6"/>
    <text x="450" y="400" text-anchor="middle" font-weight="bold" font-size="13">L2 Cache —— GM 的缺省缓存</text>
    <text x="450" y="420" text-anchor="middle" font-size="11" fill="#495057">按 Cache Line 加载（128/256/512B，视硬件规格）→ 对齐问题之源</text>

    <rect x="180" y="450" width="540" height="66" rx="10" fill="#fdf0e5" stroke="#e8590c" stroke-width="1.6"/>
    <text x="450" y="476" text-anchor="middle" font-weight="bold" font-size="13">Global Memory（GM / HBM）</text>
    <text x="450" y="496" text-anchor="middle" font-size="11" fill="#495057">大而慢：模型权重与大块数据；aclrtMalloc 分配（4.3）；搬运单元存取</text>
  </g>

  <!-- 两条使用路径注记 -->
  <rect x="700" y="146" width="176" height="130" rx="10" fill="#f4f5f6" stroke="#adb5bd" stroke-width="1.3"/>
  <text x="788" y="170" text-anchor="middle" font-size="12" font-weight="bold">Cube 路径（8.1）</text>
  <text x="788" y="192" text-anchor="middle" font-size="10.5">GM →L1 →L0A/B → Cube</text>
  <text x="788" y="210" text-anchor="middle" font-size="10.5">→ L0C → FixPipe → GM</text>
  <text x="788" y="228" text-anchor="middle" font-size="10.5">效率先看 L1 利用率，</text>
  <text x="788" y="246" text-anchor="middle" font-size="10.5">不只看 GM 带宽</text>
  <rect x="700" y="296" width="176" height="130" rx="10" fill="#f4f5f6" stroke="#adb5bd" stroke-width="1.3"/>
  <text x="788" y="320" text-anchor="middle" font-size="12" font-weight="bold">Vector 路径（8.1）</text>
  <text x="788" y="342" text-anchor="middle" font-size="10.5">GM →UB（MTE2）→ 计算</text>
  <text x="788" y="360" text-anchor="middle" font-size="10.5">→ GM（MTE3）</text>
  <text x="788" y="378" text-anchor="middle" font-size="10.5">两级层级；950 起延伸</text>
  <text x="788" y="396" text-anchor="middle" font-size="10.5">到寄存器三级（第10章）</text>

  <!-- 底部提醒 -->
  <rect x="180" y="540" width="540" height="56" rx="10" fill="#fceff1" stroke="#c92a2a" stroke-width="1.4"/>
  <text x="450" y="562" text-anchor="middle" font-size="12" font-weight="bold" fill="#c92a2a">对齐是本层级的头号纪律：数据对齐到 Cache Line（32B 起步）</text>
  <text x="450" y="582" text-anchor="middle" font-size="11" fill="#495057">没对齐 = 一次加载多搬半条线，白耗带宽（8.3 带宽利用三件事之一）</text>
</svg>
